[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sylphd"
dynamic = ["version"]
description = "A long-running sylph server and its command line: a pure-Python wrapper around the native sylphd-client."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Thomas Roder" },
  { name = "Abrinca Genomics" },
]
keywords = ["bioinformatics", "genomics", "ani", "taxonomy", "profiling", "sylph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
# The base install is light on purpose: sylphd.ncbitax and sylphd.taxdb need only httpx.
# The query commands run in `sylphd-client`, a native binary shipped as the platform wheel
# `sylphd-bin` (py3-none-<platform>, any Python); it is pinned to this exact version
# (tests/test_packaging.py keeps the pins, `__version__` and the Rust workspace in step).
dependencies = [
  "httpx",
]

[project.optional-dependencies]
# Look up NCBI taxa (a server, a socket or a file): no binary, no pysylph.
taxonomy = []
# The command line against a server: sketches locally in the native client.
client = [
  "sylphd-bin==0.8.0",
]
# `sylphd serve`, and everything `client` does. The server still sketches
# uploaded sequences (pysylph) and parses them (dnaio).
server = [
  "sylphd-bin==0.8.0",
  "dnaio",
  "pysylph",
  "python-multipart",
  "starlette",
  "uvicorn",
]

[project.urls]
Homepage = "https://abrinca.github.io/sylphd/"
Documentation = "https://abrinca.github.io/sylphd/docs/"
Repository = "https://github.com/Abrinca/sylphd"

[project.scripts]
sylphd = "sylphd.entry:main"

[tool.uv]
# `libz-ng-sys` (a dependency of the sylph Rust crate) wants `cmake` at build
# time; provide it in the isolated build environment instead of relying on a
# system-wide install.
extra-build-dependencies = { pysylph = ["cmake"] }

[tool.uv.sources]
pysylph = { git = "https://github.com/MrTomRod/pysylph", branch = "multi-db" }
# Development: `uv sync` builds the binary from this checkout (needs a Rust toolchain).
sylphd-bin = { path = "rust/sylphd-client" }

[dependency-groups]
dev = [
  "pytest",
  "sylphd[server]",
]

[tool.hatch.version]
path = "src/sylphd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sylphd"]

[tool.hatch.build.targets.sdist]
# The working tree holds tens of GB of untracked data (databases in db/, results in
# scratch/, rust/target, web/wasm). A sdist is the package: list it instead of pruning
# afterwards, so `uv build` never walks those directories. pyproject.toml is always
# included by hatchling.
only-include = ["src/sylphd", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
