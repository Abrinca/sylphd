[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sylphd"
dynamic = ["version"]
description = "A long-running sylph server with a sketching client, for shared database and profiling."
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Thomas Roder" },
  { name = "Abrinca Genomics" },
]
keywords = ["bioinformatics", "genomics", "ani", "taxonomy", "profiling", "sylph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
# The base install is light on purpose: sylphd.ncbitax and sylphd.taxdb need only httpx.
# Everything that sketches or serves is an extra: see docs/install.md.
dependencies = [
  "httpx",
]

[project.optional-dependencies]
# Look up NCBI taxa (a server, a socket or a file): no Rust, no pysylph.
taxonomy = []
# The command line against a server: sketches locally.
client = [
  "dnaio",
  "pysylph",
]
# `sylphd serve`, and everything `client` does.
server = [
  "dnaio",
  "pysylph",
  "python-multipart",
  "starlette",
  "uvicorn",
]

[project.urls]
Homepage = "https://abrinca.github.io/sylphd/"
Documentation = "https://abrinca.github.io/sylphd/docs/"
Repository = "https://github.com/Abrinca/sylphd"

[project.scripts]
sylphd = "sylphd.entry:main"

[tool.uv]
# `libz-ng-sys` (a dependency of the sylph Rust crate) wants `cmake` at build
# time; provide it in the isolated build environment instead of relying on a
# system-wide install.
extra-build-dependencies = { pysylph = ["cmake"] }

[tool.uv.sources]
pysylph = { git = "https://github.com/MrTomRod/pysylph", branch = "multi-db" }

[dependency-groups]
dev = [
  "pytest",
  "sylphd[server]",
]

[tool.hatch.version]
path = "src/sylphd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sylphd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
