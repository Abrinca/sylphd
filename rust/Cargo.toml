[workspace]
resolver = "2"
members = ["sylphd-core", "sylphd-wasm", "sylphd-client"]

[workspace.package]
# Kept in sync with `src/sylphd/__init__.py` (`__version__`); a test in
# `sylphd-client` asserts the two match.
version = "0.7.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Pinned sylph revision (MrTomRod/sylph branch sketch-core).
# `default-features = false` leaves out the CLI/needletail/rayon/... stack.
sylph = { git = "https://github.com/MrTomRod/sylph", rev = "49e8f6effe568625339057cb24eb2ac04295da1a", default-features = false }
memchr = "2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
# `scalable_cuckoo_filter` (behind sylph's `approx-dedup`) calls
# `rand::thread_rng()`, which needs a `getrandom` backend on
# wasm32-unknown-unknown. Only enabled in `sylphd-wasm` for wasm32.
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
