[package]
name = "sylph-sketch-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Browser (WebAssembly) read sketching for sylphd: a minimal port of the code behind pysylph's Sketcher.sketch_single / sketch_paired."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
fxhash = "0.2"
memchr = "2"
miniz_oxide = "0.8"
crc32fast = "1"
rand = { version = "0.8", default-features = false }
rand_xoshiro = "0.6"
scalable_cuckoo_filter = "0.2"
# `ScalableCuckooFilterBuilder::new()` calls `rand::thread_rng()`, which needs
# a `getrandom` backend on wasm32-unknown-unknown. We replace that RNG with a
# seeded one right away, so a custom (non-random) backend is registered in
# `src/lib.rs` instead of pulling in the JS `crypto` glue.
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep this crate out of any parent workspace; it is built on its own.
[workspace]
