name: Release

# Publish installable artifacts that need no Rust toolchain and compile nothing:
#
#   * the `sylphd` sdist and pure-Python wheel (`uv build`);
#   * the `sylphd-bin` wheels (`py3-none-<platform>`, the native `sylphd-client`
#     binary) for manylinux/musllinux x86_64+aarch64, macOS arm64+x86_64 and
#     Windows x86_64, plus the same binary as a standalone archive
#     (`sylphd-client-X.Y.Z-<target>.tar.gz` / `.zip`) for machines without Python;
#   * a `pysylph` wheel for every supported Linux architecture, built from the
#     exact commit pinned in `uv.lock`, for CPython 3.14, manylinux_2_28. This is
#     still needed for `sylphd[server]`: `pysylph` is the `multi-db` fork (a git
#     URL in the wheel's metadata) and PyPI has only the upstream 0.1.3, so the
#     server install would otherwise have to build it with Rust and cmake.
#   * a `dnaio` wheel for linux/aarch64, because PyPI has no wheel for that
#     platform and it is a Cython extension (see `docs/install.md`).
#   * a container image, docker.io/abrincagenomics/sylphd, with those wheels installed
#     (linux/amd64 and linux/arm64; see the `Dockerfile`).
#
# `workflow_dispatch` runs the whole pipeline as a dry run and publishes
# nothing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: the build jobs only read the repository. Creating the
# release needs `contents: write`; only the `publish` job gets it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: sdist and wheel
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that the tag matches the package version
        id: version
        run: |
          set -euo pipefail
          # The package version lives only in src/sylphd/__init__.py (hatch reads it).
          version=$(python3 -c 'import pathlib, re; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/sylphd/__init__.py").read_text()).group(1))')
          echo "src/sylphd/__init__.py: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*
          if-no-files-found: error

  client:
    name: sylphd-bin (${{ matrix.label }})
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: manylinux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            py: python3
          - label: manylinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            py: python3
          - label: musllinux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            py: python3
          # Cross-compiled from x86_64: for musl targets maturin-action runs the
          # rust-cross/rust-musl-cross image (an x86_64 container carrying every musl
          # cross toolchain), which cannot start on an arm64 runner.
          - label: musllinux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            py: python3
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            py: python3
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            py: python3
          - label: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            py: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `bindings = "bin"`: the wheel is py3-none-<platform> (one wheel for every
      # Python version) and carries the binary in `<wheel>.data/scripts/`. The musl
      # builds need the musllinux container, hence `manylinux`; rustls+ring means no
      # cmake and no aws-lc are involved.
      - name: Build the sylphd-bin wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust/sylphd-client
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: v1.16.0
          args: --release --locked --out ../../dist
      # The same binary as a bare archive, for machines without Python. Taken out of
      # the wheel, so the two can never differ. Written to `archives/`: on Linux
      # maturin-action builds in a container that leaves `dist/` owned by root, so the
      # runner user can read it but not add files to it.
      - name: Package the standalone binary
        shell: bash
        env:
          VERSION: ${{ needs.sdist.outputs.version }}
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ matrix.py }}
        run: |
          set -euo pipefail
          "$PYTHON" - "$VERSION" "$TARGET" <<'PY'
          import os, pathlib, sys, tarfile, zipfile

          version, target = sys.argv[1], sys.argv[2]
          (wheel,) = sorted(pathlib.Path("dist").glob("sylphd_bin-*.whl"))
          archives = pathlib.Path("archives")
          archives.mkdir()
          with zipfile.ZipFile(wheel) as archive:
              member = next(n for n in archive.namelist() if ".data/scripts/sylphd-client" in n)
              data = archive.read(member)
          binary = "sylphd-client.exe" if member.endswith(".exe") else "sylphd-client"
          staging = pathlib.Path("stage")
          staging.mkdir()
          (staging / binary).write_bytes(data)
          os.chmod(staging / binary, 0o755)
          stem = archives / f"sylphd-client-{version}-{target}"
          if target.endswith("windows-msvc"):
              with zipfile.ZipFile(f"{stem}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.write(staging / binary, binary)
              print(f"wrote {stem}.zip")
          else:
              with tarfile.open(f"{stem}.tar.gz", "w:gz") as archive:
                  archive.add(staging / binary, binary)
              print(f"wrote {stem}.tar.gz")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist-client-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
      # A separate artifact: one with two roots would keep `dist/` and `archives/`
      # prefixes, and the later jobs merge every `dist-*` artifact flat into dist/.
      - uses: actions/upload-artifact@v7
        with:
          name: dist-archive-${{ matrix.label }}
          path: archives/*
          if-no-files-found: error

  wheels:
    name: pysylph wheel (${{ matrix.arch }})
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the pysylph source from uv.lock
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re, tomllib

          lock = tomllib.loads(pathlib.Path("uv.lock").read_text())
          packages = {package["name"]: package for package in lock["package"]}
          source = packages["pysylph"]["source"]["git"]
          url, rev = source.split("#", 1)
          repo = re.sub(r"^https://github\.com/", "", url.split("?")[0]).rstrip("/")
          version = packages["pysylph"]["version"]
          print(f"repo={repo}")
          print(f"rev={rev}")
          # A local version label keeps the fork's wheel distinct from PyPI's
          # pysylph 0.1.3, so installs can never pick the wrong one.
          print(f"label={version}+g{rev[:7]}")
          print(f"dnaio={packages['dnaio']['version']}")
          PY
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.rev }}
          path: pysylph-src
          persist-credentials: false
      - name: Set the local version label in the fork
        working-directory: pysylph-src
        env:
          LABEL: ${{ steps.pin.outputs.label }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          # `[project] dynamic = ["version"]`: maturin reads the version from
          # Cargo.toml, and Cargo's build metadata maps onto a PEP 440 local
          # version (0.1.3+g9bb3c71).
          path = pathlib.Path("Cargo.toml")
          text = path.read_text()
          patched, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{os.environ["LABEL"]}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not find the package version in Cargo.toml")
          path.write_text(patched)
          PY
          grep -n '^version' Cargo.toml
      # PyO3/maturin-action builds inside a pypa/manylinux_2_28 container, which
      # ships cmake (needed by libz-ng-sys) and every CPython. `manylinux: 2_28`
      # is fine for Oracle Linux 10 (glibc 2.39).
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: pysylph-src
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --out dist --interpreter /opt/python/cp314-cp314/bin/python
          before-script-linux: cmake --version
      # dnaio is a Cython extension and PyPI publishes no linux/aarch64 wheel,
      # so build one here; otherwise the server would need a C compiler.
      - name: Build the dnaio wheel (PyPI has no aarch64 wheel)
        if: matrix.arch == 'aarch64'
        env:
          DNAIO_VERSION: ${{ steps.pin.outputs.dnaio }}
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
        run: |
          set -eux
          mkdir -p dist dnaio-dist
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /io "$MANYLINUX_IMAGE" bash -ec "
            /opt/python/cp314-cp314/bin/python -m pip wheel --no-deps --no-binary :all: \
              --wheel-dir /io/dnaio-dist 'dnaio==$DNAIO_VERSION'
            auditwheel repair --wheel-dir /io/dist /io/dnaio-dist/dnaio-*.whl
          "
      - name: Collect the wheels
        # The container writes the wheels as root; copying only needs read
        # access, unlike moving them out of a root-owned directory.
        run: |
          set -eux
          mkdir -p dist
          cp -v pysylph-src/dist/*.whl dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    name: install and smoke test (${{ matrix.arch }})
    needs: [sdist, wheels, client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
      # The pure `sylphd` wheel, the pysylph/dnaio wheels and the `sylphd-bin` wheel
      # for this platform, all in dist/.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # `--only-binary :all:` fails the run if anything would have to be built
      # from source, which is exactly the guarantee we sell to the server.
      - name: Install from the built wheels only
        env:
          VERSION: ${{ needs.sdist.outputs.version }}
        run: |
          set -eux
          ls -l dist
          uv venv --python 3.14 smoke
          VIRTUAL_ENV="$PWD/smoke" uv pip install --python smoke/bin/python \
            --only-binary :all: --find-links dist "sylphd[server]==$VERSION" pytest
          smoke/bin/sylphd --version
          smoke/bin/sylphd-client --version
          # `sylphd info --help` is the binary's help: this is the forwarding.
          smoke/bin/sylphd info --help > /dev/null
          smoke/bin/sylphd --help | grep -q "sylphd-client"
          # The fork's wheel, not PyPI's pysylph 0.1.3.
          smoke/bin/python -c 'import pysylph; print(pysylph.__version__); assert "+g" in pysylph.__version__'
      - name: The base install needs no pysylph
        env:
          VERSION: ${{ needs.sdist.outputs.version }}
        run: |
          set -eux
          uv venv --python 3.14 lean
          VIRTUAL_ENV="$PWD/lean" uv pip install --python lean/bin/python \
            --only-binary :all: --find-links dist "sylphd==$VERSION"
          lean/bin/python -c 'import sylphd'
          ! lean/bin/python -c 'import pysylph' 2> /dev/null
          # The base install has no binary: the wrapper says how to get one.
          lean/bin/sylphd --help | grep -q "sylphd\[client\]"
      - name: Run a test subset against the installed package
        env:
          # The wheel's binary is in the venv; a missing one is a failure, not a skip.
          SYLPHD_REQUIRE_CLIENT_BIN: "1"
        run: |
          set -eux
          smoke/bin/python -m pytest -q \
            tests/test_server.py tests/test_client_binary.py tests/test_entry.py

  image:
    name: container image
    # The smoke-tested wheels in a bare uv/Python image, for amd64 and arm64.
    # Nothing is compiled, so emulating arm64 only runs `uv pip install`.
    # Pushed on tags; `workflow_dispatch` only builds.
    needs: [sdist, wheels, client, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build and push
        env:
          VERSION: ${{ needs.sdist.outputs.version }}
          PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eux
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
          image=docker.io/abrincagenomics/sylphd
          if [ "$PUSH" = true ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            output=--push
          else
            output=
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$image:$VERSION" -t "$image:latest" $output .

  publish:
    name: publish the GitHub release
    # Tags only: `workflow_dispatch` is the dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [sdist, wheels, client, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -eux
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
