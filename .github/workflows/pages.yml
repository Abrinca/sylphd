name: Web page and documentation

# One GitHub Pages site: the web app (web/) at the root and the Zensical
# documentation (docs/) under /docs/.
on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "docs/**"
      - "sketch-wasm/**"
      - "zensical.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
      - "sketch-wasm/**"
      - "zensical.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: the build only reads the repository. Publishing a Pages
# deployment additionally needs `pages: write` and `id-token: write`; those are
# granted per job below, only to the job that deploys.
permissions:
  contents: read

env:
  # The "Reads" mode sketches in the browser with sketch-wasm/ (Rust -> WebAssembly), built here
  # and copied into the site; the binaries are not committed. wasm-bindgen-cli must equal the
  # `wasm-bindgen` crate version in sketch-wasm/Cargo.toml (pinned with `=`).
  RUST_VERSION: "1.98.1"
  WASM_BINDGEN_VERSION: "0.2.129"
  # sha256 of wasm-bindgen-<version>-x86_64-unknown-linux-musl.tar.gz (GitHub release asset)
  WASM_BINDGEN_SHA256: "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `actions/configure-pages` reads the repository's Pages settings.
      pages: read
    steps:
      - uses: actions/checkout@v7
      # v10.3.1 (there is no `v10` tag).
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uvx zensical build --clean --strict
      - name: Install the Rust wasm toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          base="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/wb.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$base.tar.gz"
          echo "$WASM_BINDGEN_SHA256  $RUNNER_TEMP/wb.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/wb.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "$base/wasm-bindgen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sketch-wasm/target
          key: wasm-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('sketch-wasm/Cargo.lock') }}
      - name: Build the WebAssembly sketcher into web/wasm
        run: sketch-wasm/build.sh ../web/wasm
      # web/ (with wasm/) at the root, the built docs under docs/.
      - name: Assemble the Pages artifact
        run: |
          mkdir -p public
          cp -r web/. public/
          cp -r site public/docs
      # Publishing steps only run for the deployable branch of the canonical
      # repository: never from pull requests, forks or other branches.
      - uses: actions/configure-pages@v6
        if: github.repository == 'Abrinca/sylphd' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.repository == 'Abrinca/sylphd' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.repository == 'Abrinca/sylphd' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
